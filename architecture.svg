<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;background:transparent">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .box-gray  { fill:#F1EFE8; stroke:#888780; }
    .box-purple{ fill:#EEEDFE; stroke:#534AB7; }
    .box-blue  { fill:#E6F1FB; stroke:#185FA5; }
    .box-green { fill:#EAF3DE; stroke:#3B6D11; }
    .box-teal  { fill:#E1F5EE; stroke:#0F6E56; }
    .box-amber { fill:#FAEEDA; stroke:#854F0B; }
    .box-coral { fill:#FAECE7; stroke:#993C1D; }
    .t-gray    { fill:#444441; }
    .t-purple  { fill:#3C3489; }
    .t-blue    { fill:#0C447C; }
    .t-green   { fill:#27500A; }
    .t-teal    { fill:#085041; }
    .t-amber   { fill:#633806; }
    .t-coral   { fill:#712B13; }
    .ts-gray   { fill:#5F5E5A; }
    .ts-purple { fill:#534AB7; }
    .ts-blue   { fill:#185FA5; }
    .ts-green  { fill:#3B6D11; }
    .ts-teal   { fill:#0F6E56; }
    .ts-amber  { fill:#854F0B; }
    .ts-coral  { fill:#993C1D; }
    .arr       { stroke:#888780; stroke-width:1.2; fill:none; marker-end:url(#arrow); }
  </style>
</defs>

<!-- TIER 1: USERS -->
<rect x="200" y="30" width="280" height="56" rx="8" stroke-width="0.5" class="box-gray"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" class="t-gray">Users</text>
<text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" class="ts-gray">Web App · Voice Call · WhatsApp</text>

<!-- Users to Core arrows -->
<line x1="270" y1="86" x2="168" y2="150" class="arr"/>
<line x1="410" y1="86" x2="512" y2="150" class="arr"/>

<!-- TIER 2: CORE LAYER -->
<!-- Next.js Frontend -->
<rect x="30" y="150" width="270" height="56" rx="8" stroke-width="0.5" class="box-purple"/>
<text x="165" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" class="t-purple">Next.js Frontend</text>
<text x="165" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" class="ts-purple">Vercel · React 19 · PWA</text>

<!-- LiveKit Voice Agent -->
<rect x="380" y="150" width="270" height="56" rx="8" stroke-width="0.5" class="box-blue"/>
<text x="515" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" class="t-blue">LiveKit Voice Agent</text>
<text x="515" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" class="ts-blue">Python · Cloud hosted</text>

<!-- Bidirectional arrows between core -->
<line x1="300" y1="174" x2="380" y2="174" class="arr"/>
<line x1="380" y1="184" x2="300" y2="184" class="arr"/>

<!-- Core to Services arrows -->
<line x1="78"  y1="206" x2="78"  y2="265" class="arr"/>
<line x1="155" y1="206" x2="208" y2="265" class="arr"/>
<line x1="228" y1="206" x2="345" y2="265" class="arr"/>
<line x1="478" y1="206" x2="478" y2="265" class="arr"/>
<line x1="558" y1="206" x2="598" y2="265" class="arr"/>

<!-- TIER 3: EXTERNAL SERVICES -->
<!-- Playwright -->
<rect x="30"  y="265" width="110" height="52" rx="8" stroke-width="0.5" class="box-green"/>
<text x="85"  y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" class="t-green">Playwright</text>
<text x="85"  y="303" text-anchor="middle" dominant-baseline="central" font-size="12" class="ts-green">Form filler</text>

<!-- Groq LLM -->
<rect x="155" y="265" width="110" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
<text x="210" y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" class="t-teal">Groq LLM</text>
<text x="210" y="303" text-anchor="middle" dominant-baseline="central" font-size="12" class="ts-teal">Llama 3.3 70B</text>

<!-- myScheme API -->
<rect x="280" y="265" width="130" height="52" rx="8" stroke-width="0.5" class="box-amber"/>
<text x="345" y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" class="t-amber">myScheme API</text>
<text x="345" y="303" text-anchor="middle" dominant-baseline="central" font-size="12" class="ts-amber">4,600+ schemes</text>

<!-- Gemini AI -->
<rect x="425" y="265" width="110" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
<text x="480" y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" class="t-teal">Gemini AI</text>
<text x="480" y="303" text-anchor="middle" dominant-baseline="central" font-size="12" class="ts-teal">Vision · OCR</text>

<!-- Sarvam AI -->
<rect x="550" y="265" width="100" height="52" rx="8" stroke-width="0.5" class="box-coral"/>
<text x="600" y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" class="t-coral">Sarvam AI</text>
<text x="600" y="303" text-anchor="middle" dominant-baseline="central" font-size="12" class="ts-coral">STT / TTS</text>

</svg>
